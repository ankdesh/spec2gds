[project]
name = "testplan-service"
version = "0.1.0"
description = "Self-contained hierarchical testplan management service and interactive web editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
testplan-service = "testplan_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testplan_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:cannot collect test class 'TestPlan.*':pytest.PytestCollectionWarning",
    "ignore:.*StarletteDeprecationWarning.*",
]
