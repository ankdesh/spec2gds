[project]
name = "spec2gds-ai-assistant"
version = "0.1.0"
description = "Independent AI Assistant and A2A Circuit/Spec editing service for spec2gds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server,sqlite]>=0.3.22",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.35.0",
    "spec2gds-runtime",
]

[tool.uv.sources]
spec2gds-runtime = { path = "../runtime", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.0",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]

[project.scripts]
spec2gds-ai-assistant = "spec2gds_assistant.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec2gds_assistant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
