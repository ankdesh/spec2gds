# Shared spec2gds layer for both browser and one-shot profiles.
- id: agent-default-model
  config:
    provider: openai
    model: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL || 'https://api.openai.com/v1'
        models:
          - id: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are the focused spec2gds hardware-design assistant.

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.SPEC2GDS_SCRATCH_ROOT || process.cwd()

- id: approval
  config:
    policy: ask

# Snapshot tests select uncompressed JSONL so the Harness replay plugin can
# consume the durable artifact directly. Production retains zstd by default.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js process.env.SPEC2GDS_SESSION_COMPRESSION || 'zstd'

# spec2gds domain tools replace general-purpose coding and delegation tools.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Generic Harness goals can turn a single design request into an autonomous
# multi-turn loop. Disable the state, driver, command, tool, and UI together so
# historical goal state cannot resume in the background. Keep them unavailable
# until spec2gds owns bounded, review-aware goal semantics.
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: ui-goal
  disabled: true

- insert:
    - id: spec2gds-assistant
      name: '@spec2gds/harness-assistant'
      config:
        provider: openai
        model: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'
        stateRoot: !!js process.env.ASSISTANT_STATE || dshHomePath('product')
        scratchRoot: !!js process.env.SPEC2GDS_SCRATCH_ROOT || dshHomePath('workspaces')
        specDocumentRoot: !!js process.env.SPEC_DOCUMENT_ROOT || dshHomePath('spec-documents')
        specAllowlist: !!js process.env.SPEC_SERVICE_ALLOWLIST || 'http://127.0.0.1:6010'
        circuitAllowlist: !!js process.env.CIRCUIT_SERVICE_ALLOWLIST || 'http://127.0.0.1:6011/api/circuit-designer/v1'
        requestTimeoutMs: !!js Number(process.env.ASSISTANT_OWNER_TIMEOUT_MS || 30000)
        maxStepsPerTurn: !!js Number(process.env.ASSISTANT_MAX_STEPS_PER_TURN || 3)
        maxOutputTokens: !!js Number(process.env.ASSISTANT_MAX_OUTPUT_TOKENS || 1200)
