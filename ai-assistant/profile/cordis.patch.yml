# Shared spec2gds layer for both browser and one-shot profiles.
- id: agent-default-model
  config:
    provider: openai
    model: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL || 'https://api.openai.com/v1'
        models: !!js Array.from(new Set([process.env.OPENAI_MODEL || 'gpt-4o-mini', 'gpt-5.6-luna']), id => ({ id }))

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are the focused spec2gds hardware-design assistant.

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.SPEC2GDS_SCRATCH_ROOT || process.cwd()

- id: approval
  config:
    policy: ask

# Snapshot tests select uncompressed JSONL so the Harness replay plugin can
# consume the durable artifact directly. Production retains zstd by default.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js process.env.SPEC2GDS_SESSION_COMPRESSION || 'zstd'

# spec2gds domain tools replace general-purpose coding and delegation tools.
- id: compaction-basic
  config:
    maxTokens: !!js Number(process.env.ASSISTANT_MAX_OUTPUT_TOKENS || 1200)

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Native goals are exposed only by the goal preset. The execution service
# accounts for requests and enforces aggregate host-owned budgets.
- id: goal
  disabled: false
  config:
    defaultMaxGoalRounds: 8
- id: goal-round-driver
  disabled: false
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: ui-goal
  disabled: true

# Cordis replaces config objects: explicitly retain the native JSON default.
# Route the event delivery ledger to SQLite.
- id: storage-domain
  config:
    backend: json
    routes:
      event_systems: sqlite

- insert:
    - id: prompt-catalog
      name: '@deepseek-ai/dsh-prompt-catalog'

    - id: prompt-catalog-yaml
      name: '@deepseek-ai/dsh-prompt-catalog-yaml'
      config:
        roots:
          - !!js (process.env.SPEC2GDS_CATALOG_ROOT || dshHomePath('profiles', process.env.ASSISTANT_PROFILE || 'spec2gds-web', 'node_modules', '@spec2gds', 'harness-assistant', 'profile', 'catalog')) + '/prompts'

    # Retain historical workflow event decoding; new presets do not start workflows.
    - id: s-workflow
      name: '@deepseek-ai/dsh-s-workflow'

    - id: s-workflow-yaml
      name: '@deepseek-ai/dsh-s-workflow-yaml'
      config:
        roots:
          - !!js (process.env.SPEC2GDS_CATALOG_ROOT || dshHomePath('profiles', process.env.ASSISTANT_PROFILE || 'spec2gds-web', 'node_modules', '@spec2gds', 'harness-assistant', 'profile', 'catalog')) + '/workflows'
          - !!js (process.env.SPEC2GDS_CATALOG_ROOT || dshHomePath('profiles', process.env.ASSISTANT_PROFILE || 'spec2gds-web', 'node_modules', '@spec2gds', 'harness-assistant', 'profile', 'catalog')) + '/adapters'

    - id: event-system-storage
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('event-systems.sqlite3')

    - id: event-systems
      name: '@deepseek-ai/dsh-event-system'

    - id: event-systems-invariant
      name: '@deepseek-ai/dsh-event-system/invariant'

    - id: event-systems-yaml
      name: '@deepseek-ai/dsh-event-system-yaml'
      config:
        roots:
          - !!js (process.env.SPEC2GDS_CATALOG_ROOT || dshHomePath('profiles', process.env.ASSISTANT_PROFILE || 'spec2gds-web', 'node_modules', '@spec2gds', 'harness-assistant', 'profile', 'catalog')) + '/event-systems'
        maxFileBytes: 262144
        maxPromptBytes: 32768

    - id: spec2gds-assistant
      name: '@spec2gds/harness-assistant'
      config:
        provider: openai
        model: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'
        stateRoot: !!js process.env.ASSISTANT_STATE || dshHomePath('product')
        scratchRoot: !!js process.env.SPEC2GDS_SCRATCH_ROOT || dshHomePath('workspaces')
        specDocumentRoot: !!js process.env.SPEC_DOCUMENT_ROOT || dshHomePath('spec-documents')
        specAllowlist: !!js process.env.SPEC_SERVICE_ALLOWLIST || 'http://127.0.0.1:6010'
        circuitAllowlist: !!js process.env.CIRCUIT_SERVICE_ALLOWLIST || 'http://127.0.0.1:6011/api/circuit-designer/v1'
        requestTimeoutMs: !!js Number(process.env.ASSISTANT_OWNER_TIMEOUT_MS || 30000)
        maxStepsPerTurn: !!js Number(process.env.ASSISTANT_MAX_STEPS_PER_TURN || 3)
        maxOutputTokens: !!js Number(process.env.ASSISTANT_MAX_OUTPUT_TOKENS || 1200)
        interactiveForms: !!js (process.env.ASSISTANT_PROFILE || 'spec2gds-web') === 'spec2gds-web'
        execution:
          goal:
            maxRounds: 8
            maxRequests: 32
            maxTokens: 300000
            maxActiveMillis: 1800000
            maxMembers: 1
            maxConcurrency: 1
            maxPending: 100
            maxEvents: 256
            maxPayloadBytes: 131072
            maxDepth: 16
          orchestrated:
            maxRounds: 8
            maxRequests: 48
            maxTokens: 500000
            maxActiveMillis: 2700000
            maxMembers: 7
            maxConcurrency: 3
            maxPending: 1000
            maxEvents: 1000
            maxPayloadBytes: 131072
            maxDepth: 16
