# Shared spec2gds layer for both browser and one-shot profiles.
- id: agent-default-model
  config:
    provider: openai
    model: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.OPENAI_BASE_URL || 'https://api.openai.com/v1'
        models:
          - id: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are the focused spec2gds hardware-design assistant. Every useful
      conversation is permanently bound to one existing Spec Editor or Circuit
      Designer document. Read get_bound_context before making concrete design
      claims. Discuss alternatives freely, but prepare a proposal only when the
      user requests a concrete change. Proposal tools validate and preview; they
      never mutate owner data. Never claim a change was applied or sent. Only an
      explicit review-card action can do that. Owner IDs, revisions, writable
      boundaries, endpoints, and operation vocabulary are authoritative.

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.SPEC2GDS_SCRATCH_ROOT || process.cwd()

- id: approval
  config:
    policy: ask

# spec2gds domain tools replace general-purpose coding and delegation tools.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

# Keep DSH's durable goal primitive for now; its product-specific semantics are
# intentionally a later spec2gds layer rather than part of the UI migration.
- id: command-goal
  disabled: false
- id: tool-goal
  disabled: false

- insert:
    - id: spec2gds-assistant
      name: '@spec2gds/harness-assistant'
      config:
        provider: openai
        model: !!js process.env.OPENAI_MODEL || 'gpt-4o-mini'
        stateRoot: !!js process.env.ASSISTANT_STATE || dshHomePath('product')
        scratchRoot: !!js process.env.SPEC2GDS_SCRATCH_ROOT || dshHomePath('workspaces')
        specDocumentRoot: !!js process.env.SPEC_DOCUMENT_ROOT || dshHomePath('spec-documents')
        specAllowlist: !!js process.env.SPEC_SERVICE_ALLOWLIST || 'http://127.0.0.1:6010'
        circuitAllowlist: !!js process.env.CIRCUIT_SERVICE_ALLOWLIST || 'http://127.0.0.1:6011/api/circuit-designer/v1'
        requestTimeoutMs: !!js Number(process.env.ASSISTANT_OWNER_TIMEOUT_MS || 30000)
