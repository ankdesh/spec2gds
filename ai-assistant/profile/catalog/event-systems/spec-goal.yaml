{
  "id": "spec2gds.spec.goal",
  "version": "2.0.0",
  "primary": "primary",
  "agents": [
    {
      "id": "primary",
      "prompt": "prompts/goal.md",
      "agentPreset": "goal",
      "tools": [
        "get_bound_context",
        "ask_user_question",
        "get_event_system",
        "get_goal",
        "create_goal",
        "update_goal",
        "wait_for_event",
        "flow_create_empty_spec",
        "flow_create_spec_with_component",
        "flow_add_component",
        "structured_output",
        "get_flow",
        "flow_edit_spec"
      ],
      "publishes": []
    }
  ],
  "events": {
    "review.prepared": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "review.applied": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "review.discarded": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "source.changed": {
      "type": "object",
      "properties": {
        "trigger_id": {
          "type": "string"
        },
        "url": {
          "type": "string"
        },
        "value_json": {
          "type": "string"
        },
        "previous_digest": {
          "type": "string"
        },
        "current_digest": {
          "type": "string"
        }
      },
      "required": [
        "trigger_id",
        "url",
        "value_json",
        "previous_digest",
        "current_digest"
      ],
      "additionalProperties": false
    },
    "architecture.prepared": {
      "type": "object",
      "properties": {
        "review_id": {
          "type": "string"
        }
      },
      "required": [
        "review_id"
      ],
      "additionalProperties": false
    },
    "architecture.decided": {
      "type": "object",
      "properties": {
        "review_id": {
          "type": "string"
        },
        "decision": {
          "type": "string",
          "enum": [
            "approved",
            "revised",
            "cancelled"
          ]
        }
      },
      "required": [
        "review_id",
        "decision"
      ],
      "additionalProperties": false
    }
  },
  "subscriptions": [
    {
      "id": "owner-receipt",
      "event": "review.applied",
      "target": "primary"
    },
    {
      "id": "owner-discard",
      "event": "review.discarded",
      "target": "primary"
    },
    {
      "id": "source-change",
      "event": "source.changed",
      "target": "primary"
    }
  ]
}
