{
  "id": "spec2gds.spec.orchestrated",
  "version": "2.0.0",
  "primary": "primary",
  "agents": [
    {
      "id": "primary",
      "prompt": "prompts/primary.md",
      "agentPreset": "orchestrated",
      "tools": [
        "get_bound_context",
        "ask_user_question",
        "get_event_system",
        "wait_for_event"
      ],
      "publishes": []
    },
    {
      "id": "analyst",
      "prompt": "prompts/analyst.md",
      "tools": [
        "get_bound_context",
        "publish_event",
        "get_event_system"
      ],
      "publishes": [
        "analysis.ready"
      ]
    },
    {
      "id": "reviewer",
      "prompt": "prompts/reviewer.md",
      "tools": [
        "get_bound_context",
        "publish_event",
        "get_event_system"
      ],
      "publishes": [
        "review.ready"
      ]
    }
  ],
  "events": {
    "review.prepared": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "review.applied": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "review.discarded": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "user.requested": {
      "type": "object",
      "properties": {
        "text": {
          "type": "string"
        }
      },
      "required": [
        "text"
      ],
      "additionalProperties": false
    },
    "analysis.ready": {
      "type": "object",
      "properties": {
        "findings": {
          "type": "string"
        }
      },
      "required": [
        "findings"
      ],
      "additionalProperties": false
    },
    "review.ready": {
      "type": "object",
      "properties": {
        "result": {
          "type": "string"
        }
      },
      "required": [
        "result"
      ],
      "additionalProperties": false
    },
    "source.changed": {
      "type": "object",
      "properties": {
        "trigger_id": {
          "type": "string"
        },
        "url": {
          "type": "string"
        },
        "value_json": {
          "type": "string"
        },
        "previous_digest": {
          "type": "string"
        },
        "current_digest": {
          "type": "string"
        }
      },
      "required": [
        "trigger_id",
        "url",
        "value_json",
        "previous_digest",
        "current_digest"
      ],
      "additionalProperties": false
    },
    "architecture.prepared": {
      "type": "object",
      "properties": {
        "review_id": {
          "type": "string"
        }
      },
      "required": [
        "review_id"
      ],
      "additionalProperties": false
    },
    "architecture.decided": {
      "type": "object",
      "properties": {
        "review_id": {
          "type": "string"
        },
        "decision": {
          "type": "string",
          "enum": [
            "approved",
            "revised",
            "cancelled"
          ]
        }
      },
      "required": [
        "review_id",
        "decision"
      ],
      "additionalProperties": false
    }
  },
  "subscriptions": [
    {
      "id": "analyze",
      "event": "user.requested",
      "target": "analyst",
      "retry": {
        "replaySafe": true,
        "maxAttempts": 3,
        "initialBackoffMillis": 1000,
        "maxBackoffMillis": 10000
      }
    },
    {
      "id": "review",
      "event": "analysis.ready",
      "target": "reviewer",
      "retry": {
        "replaySafe": true,
        "maxAttempts": 3,
        "initialBackoffMillis": 1000,
        "maxBackoffMillis": 10000
      }
    },
    {
      "id": "prepare",
      "event": "review.ready",
      "target": "primary"
    },
    {
      "id": "source-change",
      "event": "source.changed",
      "target": "analyst",
      "retry": {
        "replaySafe": true,
        "maxAttempts": 3,
        "initialBackoffMillis": 1000,
        "maxBackoffMillis": 10000
      }
    }
  ]
}
