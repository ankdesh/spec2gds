{
  "id": "spec2gds.spec.orchestrated",
  "version": "1.0.0",
  "primary": "primary",
  "agents": [
    {
      "id": "primary",
      "prompt": "prompts/primary.md",
      "agentPreset": "orchestrated",
      "tools": [
        "get_bound_context",
        "prepare_spec_proposal",
        "ask_user_question",
        "get_event_system",
        "prepare_spec_document_creation"
      ],
      "publishes": []
    },
    {
      "id": "analyst",
      "prompt": "prompts/analyst.md",
      "tools": [
        "get_bound_context",
        "publish_event",
        "get_event_system"
      ],
      "publishes": [
        "analysis.ready"
      ]
    },
    {
      "id": "reviewer",
      "prompt": "prompts/reviewer.md",
      "tools": [
        "get_bound_context",
        "publish_event",
        "get_event_system"
      ],
      "publishes": [
        "review.ready"
      ]
    }
  ],
  "events": {
    "review.prepared": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "review.applied": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "review.discarded": {
      "type": "object",
      "properties": {
        "proposal_id": {
          "type": "string"
        }
      },
      "required": [
        "proposal_id"
      ],
      "additionalProperties": false
    },
    "user.requested": {
      "type": "object",
      "properties": {
        "text": {
          "type": "string"
        }
      },
      "required": [
        "text"
      ],
      "additionalProperties": false
    },
    "analysis.ready": {
      "type": "object",
      "properties": {
        "findings": {
          "type": "string"
        }
      },
      "required": [
        "findings"
      ],
      "additionalProperties": false
    },
    "review.ready": {
      "type": "object",
      "properties": {
        "result": {
          "type": "string"
        }
      },
      "required": [
        "result"
      ],
      "additionalProperties": false
    }
  },
  "subscriptions": [
    {
      "id": "analyze",
      "event": "user.requested",
      "target": "analyst"
    },
    {
      "id": "review",
      "event": "analysis.ready",
      "target": "reviewer"
    },
    {
      "id": "prepare",
      "event": "review.ready",
      "target": "primary"
    }
  ]
}
