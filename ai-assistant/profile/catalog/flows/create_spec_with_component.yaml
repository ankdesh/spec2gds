{
  "id": "spec2gds.create_spec_with_component",
  "version": "2.0.0",
  "description": "Create a new Spec containing one complete leaf Component. Obtain architecture approval, then save its ports, description, narrative and functional SystemVerilog.",
  "inputSchema": {
    "type": "object",
    "properties": {
      "title": {
        "type": "string"
      },
      "request": {
        "type": "string"
      },
      "service_url": {
        "type": "string"
      }
    },
    "required": [
      "title",
      "request"
    ],
    "additionalProperties": false
  },
  "outputSchema": {
    "type": "object",
    "properties": {
      "proposal_id": {
        "type": "string"
      },
      "state": {
        "type": "string",
        "enum": [
          "applied",
          "discarded"
        ]
      },
      "source_revision_hash": {
        "type": "string"
      }
    },
    "required": [
      "proposal_id",
      "state",
      "source_revision_hash"
    ],
    "additionalProperties": false
  },
  "nodes": [
    {
      "id": "architecture",
      "kind": "flow",
      "flow": {
        "id": "spec2gds.architecture",
        "version": "2.0.0"
      },
      "inputs": {
        "title": {
          "$ref": "inputs.title"
        },
        "request": {
          "$ref": "inputs.request"
        },
        "creation": true
      }
    },
    {
      "id": "destination",
      "kind": "call",
      "operation": {
        "id": "spec2gds.prepare_creation",
        "version": "2.0.0"
      },
      "inputs": {
        "title": {
          "$ref": "inputs.title"
        },
        "request": {
          "$ref": "inputs.request"
        },
        "empty": false,
        "review_id": {
          "$ref": "nodes.architecture.review_id"
        }
      }
    },
    {
      "id": "create",
      "kind": "call",
      "operation": {
        "id": "spec2gds.create_spec",
        "version": "2.0.0"
      },
      "inputs": {
        "$ref": "nodes.destination"
      }
    },
    {
      "id": "binding",
      "kind": "call",
      "operation": {
        "id": "spec2gds.ensure_conversation",
        "version": "2.0.0"
      },
      "inputs": {
        "$ref": "nodes.create"
      }
    },
    {
      "id": "content",
      "kind": "flow",
      "flow": {
        "id": "spec2gds.component_content",
        "version": "2.0.0"
      },
      "inputs": {
        "session_id": {
          "$ref": "nodes.binding.session_id"
        },
        "review_id": {
          "$ref": "nodes.architecture.review_id"
        },
        "request": {
          "$ref": "inputs.request"
        }
      }
    }
  ],
  "outputs": {
    "$ref": "nodes.content"
  },
  "publication": {
    "toolName": "flow_create_spec_with_component",
    "contexts": [
      "spec2gds.new",
      "spec2gds.document",
      "spec2gds.entity"
    ]
  }
}
