{
  "id": "spec2gds.component_content",
  "version": "3.0.0",
  "description": "Author and save a complete Component.",
  "inputSchema": {
    "type": "object",
    "properties": {
      "session_id": {
        "type": "string"
      },
      "review_id": {
        "type": "string"
      },
      "request": {
        "type": "string"
      }
    },
    "required": [
      "session_id",
      "review_id",
      "request"
    ],
    "additionalProperties": false
  },
  "outputSchema": {
    "type": "object",
    "properties": {
      "proposal_id": {
        "type": "string"
      },
      "state": {
        "type": "string",
        "enum": [
          "applied",
          "discarded"
        ]
      },
      "source_revision_hash": {
        "type": "string"
      }
    },
    "required": [
      "proposal_id",
      "state",
      "source_revision_hash"
    ],
    "additionalProperties": false
  },
  "nodes": [
    {
      "id": "context",
      "kind": "call",
      "operation": {
        "id": "spec2gds.authoring_context",
        "version": "3.0.0"
      },
      "inputs": {
        "$ref": "inputs"
      }
    },
    {
      "id": "draft",
      "kind": "model",
      "instructionsFile": "prompts/component.md",
      "conversation": {
        "$ref": "inputs.session_id"
      },
      "inputs": {
        "request": {
          "$ref": "inputs.request"
        },
        "authoring_context": {
          "$ref": "nodes.context.model_context"
        }
      },
      "outputSchema": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "ports": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "name": {
                  "type": "string"
                },
                "direction": {
                  "type": "string",
                  "enum": [
                    "in",
                    "out",
                    "inout"
                  ]
                },
                "range": {
                  "description": "Exact bounds; null is scalar. Never rebase a supplied range.",
                  "oneOf": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "description": {
                  "type": "string",
                  "description": "Concise purpose from supplied RTL or requirements."
                }
              },
              "required": [
                "name",
                "direction",
                "range",
                "description"
              ]
            }
          },
          "description": {
            "type": "string"
          },
          "narrative": {
            "type": "string"
          },
          "systemverilog": {
            "type": "string"
          },
          "parameters": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "name": {
                  "type": "string"
                },
                "rtl_type": {
                  "type": "string"
                },
                "value": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                }
              },
              "required": [
                "name",
                "rtl_type",
                "value",
                "description"
              ]
            }
          }
        },
        "required": [
          "name",
          "ports",
          "description",
          "narrative",
          "systemverilog",
          "parameters"
        ],
        "additionalProperties": false
      }
    },
    {
      "id": "submit",
      "kind": "call",
      "operation": {
        "id": "spec2gds.submit_component",
        "version": "3.0.0"
      },
      "inputs": {
        "session_id": {
          "$ref": "inputs.session_id"
        },
        "review_id": {
          "$ref": "inputs.review_id"
        },
        "context": {
          "$ref": "nodes.context"
        },
        "draft": {
          "$ref": "nodes.draft"
        }
      }
    },
    {
      "id": "saved",
      "kind": "wait",
      "request": {
        "kind": "spec-receipt",
        "session_id": {
          "$ref": "inputs.session_id"
        },
        "proposal_id": {
          "$ref": "nodes.submit.proposal_id"
        },
        "editor_url": {
          "$ref": "nodes.submit.editor_url"
        }
      },
      "outputSchema": {
        "type": "object",
        "properties": {
          "proposal_id": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "applied",
              "discarded",
              "rejected",
              "stale"
            ]
          },
          "source_revision_hash": {
            "type": "string"
          }
        },
        "required": [
          "proposal_id",
          "state",
          "source_revision_hash"
        ],
        "additionalProperties": false
      }
    },
    {
      "id": "complete",
      "kind": "call",
      "operation": {
        "id": "spec2gds.require_saved",
        "version": "3.0.0"
      },
      "inputs": {
        "$ref": "nodes.saved"
      }
    }
  ],
  "outputs": {
    "$ref": "nodes.complete"
  }
}
