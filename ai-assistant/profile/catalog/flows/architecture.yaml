{
  "id": "spec2gds.architecture",
  "version": "3.0.0",
  "description": "Prepare and review hardware architecture with the exact proposed batch for structural edits.",
  "inputSchema": {
    "type": "object",
    "properties": {
      "title": {
        "type": "string"
      },
      "request": {
        "type": "string"
      },
      "creation": {
        "type": "boolean"
      },
      "proposed_changes": {
        "type": "object",
        "additionalProperties": true
      }
    },
    "required": [
      "title",
      "request",
      "creation"
    ],
    "additionalProperties": false
  },
  "outputSchema": {
    "type": "object",
    "properties": {
      "review_id": {
        "type": "string"
      }
    },
    "required": [
      "review_id"
    ],
    "additionalProperties": false
  },
  "nodes": [
    {
      "id": "context",
      "kind": "call",
      "operation": {
        "id": "spec2gds.architecture_context",
        "version": "3.0.0"
      },
      "inputs": {
        "$ref": "inputs"
      }
    },
    {
      "id": "draft",
      "kind": "model",
      "instructionsFile": "prompts/architecture.md",
      "inputs": {
        "request": {
          "$ref": "inputs.request"
        },
        "title": {
          "$ref": "inputs.title"
        },
        "context": {
          "$ref": "nodes.context"
        }
      },
      "outputSchema": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string"
          },
          "components": {
            "type": "array",
            "description": "One or more components, each with name. Names must be nonempty and unique.",
            "items": {
              "type": "object",
              "additionalProperties": true,
              "properties": {
                "name": {
                  "type": "string",
                  "description": "Distinct nonempty entity name. Use name, not component or design."
                },
                "purpose": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                }
              },
              "required": [
                "name"
              ]
            }
          },
          "designs": {
            "type": "array",
            "description": "Composition designs, each with name. Use [] for a leaf without composition.",
            "items": {
              "type": "object",
              "additionalProperties": true,
              "properties": {
                "name": {
                  "type": "string",
                  "description": "Distinct nonempty entity name. Use name, not component or design."
                },
                "purpose": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                }
              },
              "required": [
                "name"
              ]
            }
          },
          "interfaces": {
            "type": "array",
            "description": "Exactly one group per Component with exact ports, parameters and constant_context.",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "component": {
                  "type": "string",
                  "description": "Exact name from components."
                },
                "ports": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "direction": {
                        "type": "string",
                        "enum": [
                          "in",
                          "out",
                          "inout"
                        ]
                      },
                      "range": {
                        "description": "Exact bounds; null is scalar. Never rebase a supplied range.",
                        "oneOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "description": {
                        "type": "string",
                        "description": "Concise purpose from supplied RTL or requirements."
                      }
                    },
                    "required": [
                      "name",
                      "direction",
                      "range",
                      "description"
                    ]
                  }
                },
                "parameters": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "rtl_type": {
                        "type": "string"
                      },
                      "value": {
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "name",
                      "rtl_type",
                      "value",
                      "description"
                    ]
                  }
                },
                "constant_context": {
                  "type": "string",
                  "description": "Supplied localparams, typedefs and constant functions needed for bounds; empty string if none. Do not include module wrappers or parameter declarations."
                }
              },
              "required": [
                "component",
                "ports",
                "parameters",
                "constant_context"
              ]
            }
          },
          "clocks_resets": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "decomposition_rationale": {
            "type": "string"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "open_questions": {
            "type": "array",
            "description": "Essential unresolved requirements that must block approval. Use [] when requirements and stated assumptions suffice.",
            "items": {
              "type": "string"
            }
          },
          "concrete_configuration": {
            "type": "object",
            "description": "Nonempty object containing approved concrete values, e.g. {width:16,reset:'synchronous active-high',overflow:'wrap'}.",
            "additionalProperties": true
          }
        },
        "required": [
          "title",
          "components",
          "designs",
          "interfaces"
        ]
      }
    },
    {
      "id": "review",
      "kind": "call",
      "operation": {
        "id": "spec2gds.record_architecture",
        "version": "3.0.0"
      },
      "inputs": {
        "plan": {
          "$ref": "nodes.draft"
        },
        "request": {
          "$ref": "inputs.request"
        },
        "creation": {
          "$ref": "inputs.creation"
        },
        "context": {
          "$ref": "nodes.context"
        }
      }
    },
    {
      "id": "approval",
      "kind": "wait",
      "request": {
        "kind": "architecture",
        "review_id": {
          "$ref": "nodes.review.review_id"
        }
      },
      "outputSchema": {
        "type": "object",
        "properties": {
          "review_id": {
            "type": "string"
          },
          "decision": {
            "type": "string",
            "enum": [
              "approved",
              "revised",
              "cancelled"
            ]
          },
          "feedback": {
            "type": "string"
          }
        },
        "required": [
          "review_id",
          "decision",
          "feedback"
        ],
        "additionalProperties": false
      }
    },
    {
      "id": "approved",
      "kind": "call",
      "operation": {
        "id": "spec2gds.approved_architecture",
        "version": "3.0.0"
      },
      "inputs": {
        "$ref": "nodes.approval"
      }
    }
  ],
  "outputs": {
    "$ref": "nodes.approved"
  }
}
