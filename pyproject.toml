[project]
name = "spec2gds"
version = "0.1.0"
description = "Deterministic IP-XACT-centered hardware specification packages, actions, and editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "jsonschema>=4.25.0",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pyedaa-ipxact>=0.6.5",
    "pytest>=9.0.3",
    "uvicorn[standard]>=0.35.0",
    "spec2gds-runtime",
    "jinja2>=3.1.6",
    "httpx>=0.28.0",
    "testplan-service",
]

[project.optional-dependencies]
document-import = [
    "docling>=2.114.0",
    "docling-slim[format-opendocument]>=2.114.0",
    "openai>=2.46.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]

[project.scripts]
spec2gds-server = "spec2gds.agent_spec.api.__main__:server_main"
spec2gds-editor = "spec2gds.agent_spec.api.__main__:editor_main"
spec2gds-import-document = "spec2gds.agent_spec.importers.cli:main"
spec2gds-log-viewer = "spec2gds.log_viewer:main"
testplan-service = "testplan_service.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
spec2gds-runtime = { path = "runtime", editable = true }
testplan-service = { path = "testplan-service", editable = true }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec2gds"]
