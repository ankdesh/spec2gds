[project]
name = "spec2gds"
version = "0.1.0"
description = "Deterministic IP-XACT-centered hardware specification packages, actions, and editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "jsonschema>=4.25.0",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pyedaa-ipxact>=0.6.5",
    "pytest>=9.0.3",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
spec2gds-server = "spec2gds.agent_spec.api.__main__:main"
spec2gds-editor = "spec2gds.agent_spec.api.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec2gds"]
